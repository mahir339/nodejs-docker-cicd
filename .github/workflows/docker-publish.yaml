
name: Build, Push and Deploy Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nodejs-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-backend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull Docker images
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/nodejs-frontend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-backend:latest

      - name: Deploy frontend and backend
        run: |
          docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

          docker rm -f frontend backend 2>/dev/null || true

          docker run -d \
            --name backend \
            --network app-network \
            -p 3000:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-backend:latest

          docker run -d \
            --name frontend \
            --network app-network \
            -e BACKEND_URL=http://backend:3000 \
            -p 3001:3001 \
            ghcr.io/${{ github.repository_owner }}/nodejs-frontend:latest

      - name: Verify deployment
        run: |
          docker ps
          docker network inspect app-network